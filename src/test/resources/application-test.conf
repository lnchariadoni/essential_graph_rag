# Test configuration for AppConfig tests
providers {
  ollama {
    baseUrl = "http://localhost:11434"
    requestedTimeoutSeconds = 120
  }

  openai {
    baseUrl = "https://api.openai.com/v1"
    apiKey = "test-api-key"
  }
}

embeddings {
  active = "openai-default"

  profiles {
    local-default {
      provider = "ollama"
      model = "embeddinggemma"
    }

    openai-default {
      provider = "openai"
      model = "text-embedding-3-small"
    }
  }
}

llms {
  active = "openai-default"

  profiles {
    local-default {
      provider = "ollama"
      model = "gemma4:e4b"
    }

    openai-default {
      provider = "openai"
      model = "gpt-4"
    }
  }
}

neo4j {
  url = "neo4j://localhost:7687"
  username = "test-user"
  password = "test-password"
  database = "test-db"
}

chapter2 {
  pdfUrl = "https://example.com/test.pdf"
  pdfPath = "data/test-downloadedpdf"
  chunkSize = 1000
  chunkOverlap = 100
  topK = 10
  vectorIndex = "test-vector-index"
  fulltextIndex = "test-fulltext-index"
  ingest = false
  question = "Test question for coverage"
}