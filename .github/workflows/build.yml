name: Continuous Integration & Code Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-analyze:
    name: Build, Verify and Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of SonarCloud analysis

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # Layer 2: Breaks the GitHub build if PMD rules fail
    - name: Build and Enforce Complexity Rules
      run: mvn clean verify

    # Layer 3: If the build passes, upload analytics to your dashboard
    - name: SonarCloud Deep Audit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FOR_GITHUB }}
      run: |
        mvn sonar:sonar \
          -Dsonar.projectKey=lnchariadoni_essential_graph_rag \
          -Dsonar.organization=lnchariadoni \
          -Dsonar.host.url=https://sonarcloud.io
